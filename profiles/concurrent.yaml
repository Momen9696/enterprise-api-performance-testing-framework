name: concurrent
test_type: concurrent
base_url: http://127.0.0.1:8090
users: 8
spawn_rate: 8
duration_seconds: 8
request_timeout_seconds: 5
tags: [concurrent]
wait:
  min_seconds: 0
  max_seconds: 0.05
auth:
  mode: bearer
  login_path: /auth/token
  username: demo
  password_env: DEMO_API_PASSWORD
thresholds:
  max_p95_ms: 1500
  max_p99_ms: 2500
  min_rps: 2
  max_error_pct: 3
endpoints:
  - name: list_users
    method: GET
    path: /users
    weight: 1
  - name: list_accounts
    method: GET
    path: /accounts
    weight: 1
  - name: list_transactions
    method: GET
    path: /transactions
    weight: 1
    query:
      page: "1"
      page_size: "10"
