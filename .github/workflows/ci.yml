name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      DEMO_API_USERNAME: demo
      DEMO_API_PASSWORD: demo-local-only
      DEMO_TOKEN_SECRET: demo-token-secret-local
      PERF_MAX_USERS: "25"
      PERF_MAX_DURATION_SECONDS: "180"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests
      - name: Secret scan
        run: python -m perfkit scan
      - name: Bandit
        run: bandit -r src -q -c pyproject.toml
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Unit and integration tests
        run: python -m pytest -q --tb=short
      - name: Bounded smoke against the demo API
        run: python -m perfkit run --profile profiles/ci-smoke.yaml --start-demo
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-reports
          path: reports
          if-no-files-found: ignore
